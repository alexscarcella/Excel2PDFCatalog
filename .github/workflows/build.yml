name: Build Excel2PDFCatalog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows
            artifact_name: Excel2PDFCatalog-Windows
            arch_suffix: ""
            compat_note: ""
          # Build nativa per Mac Apple Silicon (M1/M2/M3/M4).
          # NON gira sui Mac Intel: Rosetta 2 traduce Intel -> Apple Silicon, non il contrario.
          - os: macos-latest
            platform_name: macOS-AppleSilicon
            artifact_name: Excel2PDFCatalog-macOS-AppleSilicon
            arch_suffix: "-AppleSilicon"
            expected_arch: arm64
            compat_note: "Solo Mac Apple Silicon (M1, M2, M3, M4). Per i Mac Intel usare la build -Intel."
          # Build nativa x86_64 per Mac Intel.
          # macos-15-intel e' l'ultima immagine x86_64 offerta da GitHub (disponibile fino al 2027).
          - os: macos-15-intel
            platform_name: macOS-Intel
            artifact_name: Excel2PDFCatalog-macOS-Intel
            arch_suffix: "-Intel"
            expected_arch: x86_64
            compat_note: "Solo Mac Intel (x86_64). Gira anche su Apple Silicon via Rosetta 2."
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pyinstaller

    - name: Run unit tests
      run: python -m unittest discover -s tests -v

    - name: Build Windows executable
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed `
          --name Excel2PDFCatalog `
          --add-data "app;app" `
          --add-data "fonts;fonts" `
          --add-data "logs;logs" `
          --add-data "txt_intros;txt_intros" `
          --add-data "img_products;img_products" `
          --add-data "img_general;img_general" `
          --add-data "example_excel;example_excel" `
          --add-data "Excel2PDFCatalog.config;." `
          --hidden-import=openpyxl `
          --hidden-import=pandas `
          --hidden-import=reportlab `
          --hidden-import=PIL `
          --collect-all reportlab `
          --collect-all numpy `
          --collect-all pandas `
          Excel2PDFCatalog.py

    - name: Build macOS application
      if: runner.os == 'macOS'
      run: |
        # Build per l'architettura nativa del runner:
        #   macos-latest    -> arm64  (Apple Silicon)
        #   macos-15-intel  -> x86_64 (Intel)
        echo "Building for $(uname -m)"
        # onedir (non onefile) e' la scelta piu' robusta per app tkinter su macOS:
        # niente estrazione temporanea all'avvio e Tcl/Tk bundlato in modo stabile.
        pyinstaller --onedir --windowed \
          --name Excel2PDFCatalog \
          --add-data "app:app" \
          --add-data "fonts:fonts" \
          --add-data "logs:logs" \
          --add-data "txt_intros:txt_intros" \
          --add-data "img_products:img_products" \
          --add-data "img_general:img_general" \
          --add-data "example_excel:example_excel" \
          --add-data "Excel2PDFCatalog.config:." \
          --hidden-import=openpyxl \
          --hidden-import=pandas \
          --hidden-import=reportlab \
          --hidden-import=PIL \
          --collect-all reportlab \
          --collect-all numpy \
          --collect-all pandas \
          Excel2PDFCatalog.py

        # Fix permessi e firma
        chmod +x "dist/Excel2PDFCatalog.app/Contents/MacOS/Excel2PDFCatalog"
        xattr -cr "dist/Excel2PDFCatalog.app"
        codesign --force --deep --sign - "dist/Excel2PDFCatalog.app"

        # Verifica che l'architettura prodotta sia quella attesa
        BIN="dist/Excel2PDFCatalog.app/Contents/MacOS/Excel2PDFCatalog"
        file "$BIN"
        if ! file "$BIN" | grep -q "${{ matrix.expected_arch }}"; then
          echo "::error::Architettura inattesa: attesa ${{ matrix.expected_arch }}"
          exit 1
        fi

    - name: Smoke test macOS app
      if: runner.os == 'macOS'
      run: |
        # Avvia l'app per qualche secondo e verifica che scriva i marker di avvio
        # (startup.log / crash.log) nella directory dati utente: cosi' si catturano
        # crash silenziosi della build windowed gia' in CI.
        APP="$PWD/dist/Excel2PDFCatalog.app/Contents/MacOS/Excel2PDFCatalog"
        DATA_DIR="$HOME/Library/Application Support/Excel2PDFCatalog"
        rm -rf "$DATA_DIR"
        "$APP" &
        APP_PID=$!
        sleep 12
        echo "----- app status -----"
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App ancora in esecuzione (finestra aperta o in attesa)."
        else
          echo "App uscita durante l'avvio."
        fi
        kill $APP_PID 2>/dev/null || true
        wait $APP_PID 2>/dev/null || true
        echo "----- data dir -----"
        ls -la "$DATA_DIR" 2>/dev/null || echo "Nessuna directory dati creata"
        echo "----- startup.log -----"
        cat "$DATA_DIR/startup.log" 2>/dev/null || echo "startup.log non presente"
        echo "----- crash.log -----"
        cat "$DATA_DIR/crash.log" 2>/dev/null || echo "crash.log non presente"
        exit 0
    
    - name: Create Windows ZIP package
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Crea cartella per il package
        New-Item -ItemType Directory -Force -Path package
        
        # Copia l'eseguibile
        Copy-Item "dist\Excel2PDFCatalog.exe" -Destination "package\"
        
        # Copia le cartelle necessarie
        Copy-Item "fonts" -Destination "package\fonts" -Recurse -Force
        Copy-Item "img_general" -Destination "package\img_general" -Recurse -Force
        Copy-Item "txt_intros" -Destination "package\txt_intros" -Recurse -Force
        Copy-Item "example_excel" -Destination "package\example_excel" -Recurse -Force
        Copy-Item "example_catalog" -Destination "package\example_catalog" -Recurse -Force
        Copy-Item "img_products" -Destination "package\img_products" -Recurse -Force
        Copy-Item "logs" -Destination "package\logs" -Recurse -Force
        Copy-Item "Excel2PDFCatalog.config" -Destination "package\"

        # Rimuovi tutti i file .gitignore e altri files inutili
        Get-ChildItem -Path "package" -Recurse -Include ".gitignore", ".DS_Store", ".gitkeep", "*.pyc", "__pycache__" | Remove-Item -Force -Recurse
        
        # Crea README
        $readme = @"
        Excel2PDFCatalog v${{ github.event.inputs.version }} - Windows
        
        INSTALLATION:
        1. Extract all files to a folder
        2. Run Excel2PDFCatalog.exe
        
        USAGE:
        - Select your Excel file
        - Choose image folders
        - Set output folder
        - Click 'Go' to generate PDF catalog
        
        For more information visit:
        https://github.com/alexscarcella/Excel2PDFCatalog
        "@
        
        $readme | Out-File -FilePath "package\README.txt" -Encoding UTF8
        
        # Crea ZIP
        Compress-Archive -Path "package\*" -DestinationPath "Excel2PDFCatalog-Windows-v${{ github.event.inputs.version }}.zip" -Force
    
    - name: Create macOS DMG package
      if: runner.os == 'macOS'
      run: |
        # Installa create-dmg
        brew install create-dmg
        
        # Crea cartella per il package
        mkdir -p package
        cp -r "dist/Excel2PDFCatalog.app" package/
        cp -r fonts package/
        cp -r img_general package/
        cp -r txt_intros package/
        cp -r example_excel package/
        cp -r img_products package/
        cp -r logs package/
        cp -r example_catalog package/
        cp Excel2PDFCatalog.config package/
        
        # Rimuovi tutti i file .gitignore e altri files inutili
        find package -name ".gitignore" -type f -delete
        find package -name ".gitkeep" -type f -delete
        find package -name ".DS_Store" -type f -delete
        find package -name "*.pyc" -type f -delete
        find package -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
        
        # Crea README
        cat > package/README.txt << EOF
        Excel2PDFCatalog v${{ github.event.inputs.version }} - ${{ matrix.platform_name }}
        
        INSTALLATION:
        1. Copy Excel2PDFCatalog.app to Applications folder
        2. First launch: Right-click → Open (to bypass Gatekeeper)

        COMPATIBILITY:
        - ${{ matrix.compat_note }}
        - Per sapere che Mac hai: menu Apple > Informazioni su questo Mac

        USAGE:
        - Select your Excel file
        - Choose image folders
        - Set output folder
        - Click 'Go' to generate PDF catalog
        
        For more information visit:
        https://github.com/alexscarcella/Excel2PDFCatalog
        EOF
        
        # Crea DMG
        create-dmg \
          --volname "Excel2PDFCatalog Installer" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "Excel2PDFCatalog.app" 200 190 \
          --hide-extension "Excel2PDFCatalog.app" \
          --app-drop-link 600 185 \
          "Excel2PDFCatalog-macOS${{ matrix.arch_suffix }}-v${{ github.event.inputs.version }}.dmg" \
          "package/" || true
        
        # Fallback: se create-dmg fallisce, crea un ZIP
        if [ ! -f "Excel2PDFCatalog-macOS${{ matrix.arch_suffix }}-v${{ github.event.inputs.version }}.dmg" ]; then
          echo "DMG creation failed, creating ZIP instead"
          cd package
          zip -r "../Excel2PDFCatalog-macOS${{ matrix.arch_suffix }}-v${{ github.event.inputs.version }}.zip" .
          cd ..
        fi
    
    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-v${{ github.event.inputs.version }}
        path: Excel2PDFCatalog-Windows-v${{ github.event.inputs.version }}.zip
        retention-days: 400  # Massimo disponibile (richiede account Pro/Team/Enterprise)
    
    - name: Upload macOS artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-v${{ github.event.inputs.version }}
        path: |
          Excel2PDFCatalog-macOS${{ matrix.arch_suffix }}-v${{ github.event.inputs.version }}.dmg
          Excel2PDFCatalog-macOS${{ matrix.arch_suffix }}-v${{ github.event.inputs.version }}.zip
        retention-days: 400  # Massimo disponibile (richiede account Pro/Team/Enterprise)
    
    - name: Upload to Release
      if: github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Excel2PDFCatalog v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        files: |
          Excel2PDFCatalog-Windows-v${{ github.event.inputs.version }}.zip
          Excel2PDFCatalog-macOS${{ matrix.arch_suffix }}-v${{ github.event.inputs.version }}.dmg
          Excel2PDFCatalog-macOS${{ matrix.arch_suffix }}-v${{ github.event.inputs.version }}.zip
        body: |
          ## Excel2PDFCatalog v${{ github.event.inputs.version }}
          
          Create PDF product catalogs from Excel files with ease!
          
          ### Downloads:
          - **Windows**: `Excel2PDFCatalog-Windows-v${{ github.event.inputs.version }}.zip`
          - **macOS Apple Silicon (M1/M2/M3/M4)**: `Excel2PDFCatalog-macOS-AppleSilicon-v${{ github.event.inputs.version }}.dmg`
          - **macOS Intel**: `Excel2PDFCatalog-macOS-Intel-v${{ github.event.inputs.version }}.dmg`

          Non sai quale scaricare? Menu Apple → *Informazioni su questo Mac*:
          se leggi "Chip Apple M…" prendi **Apple Silicon**, se leggi "Processore Intel" prendi **Intel**.

          ### What's included:
          - Standalone executable (no Python installation needed)
          - Example Excel files
          - Sample catalog outputs
          - Fonts and assets
          - Configuration file
          
          ### Installation:
          **Windows**: Extract ZIP and run Excel2PDFCatalog.exe
          **macOS**: Mount DMG and copy to Applications
          
          ### macOS Compatibility:
          Ogni build macOS è nativa per la sua architettura: la build **Apple Silicon** (arm64) **non** funziona sui Mac Intel
          (Rosetta 2 traduce Intel → Apple Silicon, non il contrario). La build **Intel** (x86_64) funziona sui Mac Intel
          e, tramite Rosetta 2, anche sugli Apple Silicon.

          Al primo avvio macOS blocca l'app perché non è firmata con un Developer ID: clic destro sull'app → *Apri* → *Apri*.

          For documentation visit: https://github.com/alexscarcella/Excel2PDFCatalog
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}